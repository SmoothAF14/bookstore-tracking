services:
  # ---------------------------------------------------------------------------
  # FastAPI web service
  # ---------------------------------------------------------------------------
  - type: web
    name: bookstore-tracking
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "False"
      - key: DJANGO_API_URL
        sync: false
      - key: DELIVERY_SERVICE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Celery broker/backend — from the managed Redis instance below.
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: bookstore-tracking-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: bookstore-tracking-redis
          property: connectionString
      # LLM (orchestration loop)
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: deepseek/deepseek-v3.2
      - key: LLM_MAX_TOKENS
        value: "1024"
      # Google Maps — mock data only
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_MAPS_USE_MOCK
        value: "True"
      # Auth — JWT_SECRET MUST equal the Django backend's SECRET_KEY.
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_USER_ID_CLAIM
        value: user_id
      - key: REQUIRE_AUTH
        value: "True"

  # ---------------------------------------------------------------------------
  # Celery worker — executes scheduled tracking tasks asynchronously
  # ---------------------------------------------------------------------------
  - type: worker
    name: bookstore-tracking-worker
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A app.celery_app worker --loglevel=info"
    envVars:
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: bookstore-tracking-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: bookstore-tracking-redis
          property: connectionString
      - key: DJANGO_API_URL
        sync: false
      - key: DELIVERY_SERVICE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: deepseek/deepseek-v3.2
      - key: LLM_MAX_TOKENS
        value: "1024"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_MAPS_USE_MOCK
        value: "True"
      - key: JWT_SECRET
        sync: false

  # ---------------------------------------------------------------------------
  # Celery beat — schedules periodic tracking-advance / ETA recompute jobs
  # ---------------------------------------------------------------------------
  - type: worker
    name: bookstore-tracking-beat
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A app.celery_app beat --loglevel=info"
    envVars:
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: bookstore-tracking-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: bookstore-tracking-redis
          property: connectionString

  # ---------------------------------------------------------------------------
  # Redis — Celery broker + result backend
  # ---------------------------------------------------------------------------
  - type: redis
    name: bookstore-tracking-redis
    ipAllowList: []
    plan: free
