services:
  # ---------------------------------------------------------------------------
  # Single free-tier web service.
  #
  # Render's free tier does NOT include background `worker` services or managed
  # Redis. So — exactly like bookstore-backend — this one container runs the
  # FastAPI app + the Celery worker + Celery beat together under supervisord,
  # and Celery reuses the SHARED Render Redis instance via REDIS_URL (the same
  # instance the Django backend uses). No new Redis is provisioned here.
  # ---------------------------------------------------------------------------
  - type: web
    name: bookstore-tracking
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "False"
      - key: DJANGO_API_URL
        sync: false
      - key: DELIVERY_SERVICE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Celery broker/backend reuse the SHARED Redis (same as the Django
      # backend). Set REDIS_URL to that instance's connection string. Broker
      # defaults to REDIS_URL; results stay OFF to save memory.
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      # LLM (orchestration loop)
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: deepseek/deepseek-v3.2
      - key: LLM_MAX_TOKENS
        value: "1024"
      # Google Maps — mock data only
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_MAPS_USE_MOCK
        value: "True"
      # Auth — JWT_SECRET MUST equal the Django backend's SECRET_KEY.
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_USER_ID_CLAIM
        value: user_id
      - key: REQUIRE_AUTH
        value: "True"
