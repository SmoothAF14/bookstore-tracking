; supervisord.conf
;
; Runs the FastAPI app (uvicorn) + a Celery worker + Celery beat inside the
; single Render free-tier web container. Logs go to stdout/stderr so they show
; up in Render's log stream.
;
; Free-tier memory notes (512 MB shared):
;   * uvicorn: 1 worker — one app copy in RAM.
;   * celery worker: solo pool, concurrency 1 — one app copy in RAM.
;   * celery beat: tiny scheduler process.
; Watch Render's memory graph after deploy; if tight, drop beat and trigger the
; periodic tracking-advance via an external cron hitting an endpoint.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
; supervisord runs as PID 1 (via the Dockerfile CMD) and reaps children.

[program:uvicorn]
command=sh -c "uvicorn app.main:app --host 0.0.0.0 --port %(ENV_PORT)s --workers 1"
directory=/app
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:celery-worker]
command=celery -A app.celery_app worker --loglevel=info --pool=solo --concurrency=1 --without-gossip --without-mingle --without-heartbeat
directory=/app
autostart=true
autorestart=true
startsecs=10
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:celery-beat]
command=celery -A app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
directory=/app
autostart=true
autorestart=true
startsecs=10
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
